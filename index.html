
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2">
<meta name="description" content="InstaGain؛ پلتفرم کسب درآمد از اینستاگرام">
<title>InstaGain | کسب درآمد از اینستاگرام</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --paper: #F7F6F2;
    --white: #FFFFFF;
    --ink: #19191D;
    --ink-soft: #44434A;
    --muted: #68666F;
    --purple: #6729CE;
    --purple-dark: #42168F;
    --pink: #F22D83;
    --coral: #FF554D;
    --orange: #FF9D36;
    --line: #E8E5DF;
    --font: "Vazirmatn", sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    position: fixed;
    inset: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
}

.page {
    width: 100%;
    height: 100%;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    display: flex;
    justify-content: center;
    align-items: center;
    padding:
        max(13px, env(safe-area-inset-top))
        15px
        max(13px, env(safe-area-inset-bottom));
}

/* --------------------------------
   BACKGROUND ARCHITECTURE
--------------------------------- */

.background {
    position: absolute;
    inset: 0;
    z-index: -3;
    background:
        linear-gradient(135deg, transparent 49.8%, rgba(30,25,35,.025) 50%, transparent 50.2%),
        linear-gradient(45deg, transparent 49.8%, rgba(30,25,35,.018) 50%, transparent 50.2%),
        var(--paper);
    background-size: 46px 46px;
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 45%,
        rgba(255,255,255,.8),
        transparent 75%);
}

.side-rail {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 5px;
    background: linear-gradient(
        180deg,
        var(--purple),
        var(--pink) 45%,
        var(--orange)
    );
    opacity: .75;
}

.side-rail.left {
    left: 0;
}

.side-rail.right {
    right: 0;
    opacity: .35;
}

.corner-decoration {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 1px solid rgba(103,41,206,.12);
    border-radius: 32px;
    transform: rotate(45deg);
    z-index: -1;
}

.corner-decoration.top {
    top: -85px;
    left: -65px;
}

.corner-decoration.bottom {
    bottom: -90px;
    right: -65px;
}

/* --------------------------------
   MAIN CONTENT
--------------------------------- */

.content {
    width: 100%;
    max-width: 600px;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* --------------------------------
   TOP LABEL
--------------------------------- */

.top-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 37px;
    padding: 5px 18px;
    border-radius: 50px;
    border: 1px solid #DED5EF;
    background: #FFFFFF;
    box-shadow: 0 4px 15px rgba(40,25,55,.045);
    color: var(--purple-dark);
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 12px;
}

.label-dot {
    width: 9px;
    height: 9px;
    background: var(--pink);
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(242,45,131,.10);
}

/* --------------------------------
   HERO TYPOGRAPHY
--------------------------------- */

.hero {
    width: 100%;
}

.hero-title {
    font-size: clamp(35px, 10vw, 49px);
    font-weight: 900;
    line-height: 1.4;
    letter-spacing: -1.4px;
    color: var(--ink);
    overflow-wrap: anywhere;
}

.hero-title .line-two {
    display: block;
}

.hero-title .highlight {
    display: inline-block;
    position: relative;
    color: var(--purple);
}

.hero-title .highlight::after {
    content: "";
    position: absolute;
    height: 7px;
    bottom: 0px;
    right: 3%;
    left: 3%;
    background: linear-gradient(
        90deg,
        var(--pink),
        var(--purple),
        var(--orange)
    );
    border-radius: 10px;
    opacity: .85;
}

.hero-subtitle {
    margin-top: 8px;
    color: var(--ink-soft);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.9;
}

.hero-subtitle strong {
    color: var(--purple);
    font-weight: 900;
}

/* --------------------------------
   FEATURE STRIP
--------------------------------- */

.features {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 19px;
    margin-bottom: 13px;
}

.feature {
    min-width: 0;
    min-height: 64px;
    padding: 8px 9px;
    background: #FFFFFF;
    border: 1px solid #EAE6E0;
    border-radius: 15px;
    box-shadow:
        0 5px 15px rgba(34,25,45,.045),
        inset 0 1px 0 #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-align: right;
}

.feature-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 12px;
    display: grid;
    place-items: center;
}

.feature-icon svg {
    width: 22px;
    height: 22px;
}

.feature-icon.purple {
    background: #F0E8FF;
    color: var(--purple);
}

.feature-icon.pink {
    background: #FFE8F0;
    color: var(--pink);
}

.feature-text {
    min-width: 0;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.7;
    color: var(--ink);
    overflow-wrap: anywhere;
}

.feature-text strong {
    display: block;
    font-size: 16px;
    font-weight: 900;
    color: var(--purple);
}

/* --------------------------------
   INSTAGRAM-INSPIRED ICONS
--------------------------------- */

.social-strip {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 0 0 8px;
}

.social-icon {
    width: 33px;
    height: 33px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: #FFFFFF;
    border: 1px solid #EBE7E0;
    box-shadow: 0 3px 9px rgba(30,20,40,.06);
}

.social-icon svg {
    width: 19px;
    height: 19px;
}

.social-icon.heart {
    color: var(--pink);
}

.social-icon.save {
    color: var(--purple);
}

.social-icon.send {
    color: #E85D50;
}

.social-icon.repeat {
    color: #8C3ED3;
}

.social-icon.follow {
    color: #D54B89;
}

/* --------------------------------
   BRAND
--------------------------------- */

.brand {
    font-family: "Manrope", sans-serif;
    font-size: 35px;
    font-weight: 800;
    letter-spacing: -2px;
    direction: ltr;
    line-height: 1.2;
    color: var(--ink);
    margin-bottom: 0;
}

.brand .brand-accent {
    background: linear-gradient(
        110deg,
        #6A29CF,
        #E73591 65%,
        #FF744B
    );
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}

/* --------------------------------
   QR CARD - PERFECT SQUARE
--------------------------------- */

.qr-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.qr-card {
    width: min(30dvh, 100%);
    height: min(30dvh, 100vw);
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
    background: #FFFFFF;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    border: 1px solid #E6E1ED;
    box-shadow:
        0 0 0 5px rgba(255,255,255,.8),
        0 0 0 6px rgba(103,41,206,.12),
        0 15px 40px rgba(39,23,55,.12);
}

.qr-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(0,0,0,.025);
    border-radius: inherit;
}

/* Decorative QR frame corners */

.qr-card::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    top: 12px;
    left: 12px;
    border-top: 3px solid rgba(103,41,206,.10);
    border-left: 3px solid rgba(103,41,206,.10);
    border-radius: 7px 0 0 0;
}

/* --------------------------------
   FLOATING DECORATIONS
--------------------------------- */

.floating {
    position: absolute;
    z-index: 3;
    display: grid;
    place-items: center;
    border-radius: 13px;
    box-shadow: 0 7px 17px rgba(40,20,55,.10);
    pointer-events: none;
}

.floating svg {
    width: 21px;
    height: 21px;
}

.floating.like {
    width: 39px;
    height: 39px;
    top: 16%;
    right: 3%;
    background: #FFE8EF;
    color: #F23B77;
    transform: rotate(12deg);
}

.floating.bookmark {
    width: 37px;
    height: 37px;
    top: 47%;
    left: 2%;
    background: #EEE5FF;
    color: #702DD1;
    transform: rotate(-9deg);
}

.floating.share {
    width: 34px;
    height: 34px;
    top: 72%;
    right: 5%;
    background: #FFE9E4;
    color: #F16A50;
    transform: rotate(9deg);
}

.floating.follow {
    width: 35px;
    height: 35px;
    top: 85%;
    left: 5%;
    background: #FBE5F2;
    color: #D83C91;
    transform: rotate(-8deg);
}

.mini-heart {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    font-size: 19px;
    line-height: 1;
    opacity: .9;
}

.heart-one {
    top: 5%;
    right: 17%;
    color: #F04D86;
    transform: rotate(15deg);
}

.heart-two {
    top: 39%;
    left: 7%;
    color: #F47B67;
    font-size: 14px;
}

.heart-three {
    bottom: 12%;
    right: 12%;
    color: #E33C9C;
    font-size: 15px;
}

/* --------------------------------
   INSTRUCTIONS
--------------------------------- */

.instructions {
    width: 100%;
    margin-top: 17px;
}

.follow-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    padding: 10px 12px;
    min-height: 49px;
    border-radius: 14px;
    background: var(--ink);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 800;
    box-shadow: 0 6px 15px rgba(25,25,29,.12);
    overflow-wrap: anywhere;
}

.follow-label svg {
    width: 22px;
    height: 22px;
    color: #FF6A9E;
    flex-shrink: 0;
}

.instruction-title {
    font-size: clamp(23px, 6.8vw, 30px);
    line-height: 1.6;
    font-weight: 900;
    margin-top: 8px;
    color: var(--ink);
    overflow-wrap: anywhere;
}

.instruction-title .qr-word {
    color: var(--purple);
}

.instruction-subtitle {
    margin-top: 3px;
    font-size: 15px;
    line-height: 1.9;
    font-weight: 700;
    color: var(--muted);
    overflow-wrap: anywhere;
}

.instruction-subtitle strong {
    color: var(--purple);
    font-weight: 900;
}

.footer-decoration {
    width: 75px;
    height: 4px;
    margin: 11px auto 0;
    border-radius: 10px;
    background: linear-gradient(
        90deg,
        var(--pink),
        var(--purple),
        var(--orange)
    );
}

/* --------------------------------
   SMALLER MOBILE HEIGHTS
--------------------------------- */

@media (max-height: 700px) {
    .top-label {
        min-height: 32px;
        margin-bottom: 6px;
    }

    .hero-title {
        font-size: 35px;
        line-height: 1.3;
    }

    .hero-subtitle {
        margin-top: 3px;
        font-size: 15px;
    }

    .features {
        margin-top: 9px;
        margin-bottom: 7px;
    }

    .feature {
        min-height: 51px;
    }

    .feature-text {
        font-size: 13px;
    }

    .feature-text strong {
        font-size: 15px;
    }

    .social-strip {
        margin-bottom: 4px;
    }

    .social-icon {
        width: 29px;
        height: 29px;
    }

    .brand {
        font-size: 31px;
    }

    .instructions {
        margin-top: 12px;
    }

    .follow-label {
        min-height: 43px;
    }

    .instruction-title {
        font-size: 24px;
        margin-top: 4px;
    }

    .instruction-subtitle {
        margin-top: 0;
        font-size: 14px;
    }

    .footer-decoration {
        margin-top: 7px;
    }
}

/* --------------------------------
   VERY SHORT DISPLAYS
--------------------------------- */

@media (max-height: 590px) {
    .page {
        padding-top: 7px;
        padding-bottom: 7px;
    }

    .top-label {
        font-size: 14px;
        margin-bottom: 5px;
    }

    .hero-title {
        font-size: 32px;
        line-height: 1.25;
    }

    .hero-subtitle {
        font-size: 14px;
    }

    .features {
        margin-top: 6px;
        margin-bottom: 5px;
        gap: 7px;
    }

    .feature {
        min-height: 43px;
        padding: 4px;
    }

    .feature-icon {
        width: 30px;
        height: 30px;
    }

    .feature-text {
        font-size: 12px;
    }

    .feature-text strong {
        font-size: 14px;
    }

    .social-strip {
        gap: 8px;
        margin-bottom: 3px;
    }

    .social-icon {
        width: 25px;
        height: 25px;
    }

    .social-icon svg {
        width: 16px;
        height: 16px;
    }

    .brand {
        font-size: 27px;
    }

    .instructions {
        margin-top: 9px;
    }

    .follow-label {
        font-size: 14px;
        min-height: 37px;
        padding: 5px 8px;
    }

    .instruction-title {
        font-size: 22px;
    }

    .instruction-subtitle {
        font-size: 13px;
    }

    .footer-decoration {
        display: none;
    }
}

/* --------------------------------
   EXTRA NARROW SCREENS
--------------------------------- */

@media (max-width: 340px) {
    .page {
        padding-left: 11px;
        padding-right: 11px;
    }

    .hero-title {
        font-size: 33px;
    }

    .feature {
        gap: 5px;
    }

    .feature-text {
        font-size: 12px;
    }

    .floating {
        transform: scale(.85);
    }

    .instruction-title {
        font-size: 22px;
    }
}

@media (prefers-reduced-motion: no-preference) {
    .header,
    .features,
    .social-strip,
    .instructions {
        animation: fadeUp .65s ease both;
    }

    .features {
        animation-delay: .08s;
    }

    .social-strip {
        animation-delay: .14s;
    }

    .instructions {
        animation-delay: .22s;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(9px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="background"></div>

    <div class="side-rail left"></div>
    <div class="side-rail right"></div>

    <div class="corner-decoration top"></div>
    <div class="corner-decoration bottom"></div>

    <main class="content">

        <!-- HEADER -->

        <header class="header">

            <div class="top-label">
                <span class="label-dot"></span>
                دانلود اپلیکیشن
            </div>

            <h1 class="hero-title">
                پلتفرم کسب درآمد
                <span class="line-two">
                    از <span class="highlight">اینستاگرام</span>
                </span>
            </h1>

            <p class="hero-subtitle">
                <strong>استفاده آسان</strong>
                + درآمد واقعی
            </p>

        </header>

        <!-- FEATURES -->

        <section class="features">

            <div class="feature">

                <span class="feature-icon purple">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3 2"/>
                    </svg>
                </span>

                <div class="feature-text">
                    <strong>فقط یک ساعت</strong>
                    فعالیت هفتگی
                </div>

            </div>

            <div class="feature">

                <span class="feature-icon pink">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3z"/>
                    </svg>
                </span>

                <div class="feature-text">
                    <strong>اینستاگرام</strong>
                    همراه با درآمد
                </div>

            </div>

        </section>

        <!-- SOCIAL ICONS -->

        <div class="social-strip" aria-hidden="true">

            <span class="social-icon heart">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 21s-9-5.8-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.2-9 12-9 12z"/>
                </svg>
            </span>

            <span class="social-icon save">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 4h12v17l-6-4-6 4z"/>
                </svg>
            </span>

            <span class="social-icon send">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13"/>
                    <path d="M22 2l-7 20-4-9-9-4z"/>
                </svg>
            </span>

            <span class="social-icon repeat">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 2l4 4-4 4"/>
                    <path d="M3 11V9a3 3 0 0 1 3-3h15"/>
                    <path d="M7 22l-4-4 4-4"/>
                    <path d="M21 13v2a3 3 0 0 1-3 3H3"/>
                </svg>
            </span>

            <span class="social-icon follow">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="8" r="4"/>
                    <path d="M3 21v-2a6 6 0 0 1 6-6h1"/>
                    <path d="M19 8v8"/>
                    <path d="M15 12h8"/>
                </svg>
            </span>

        </div>

        <!-- BRAND -->

        <div class="brand">
            Insta<span class="brand-accent">Gain</span>
        </div>

        <!-- QR CARD -->

        <section class="qr-wrapper">

            <span class="floating like" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 21s-9-5.8-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.2-9 12-9 12z"/>
                </svg>
            </span>

            <span class="floating bookmark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 4h12v17l-6-4-6 4z"/>
                </svg>
            </span>

            <span class="floating share" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13"/>
                    <path d="M22 2l-7 20-4-9-9-4z"/>
                </svg>
            </span>

            <span class="floating follow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="8" r="4"/>
                    <path d="M3 21v-2a6 6 0 0 1 6-6h1"/>
                    <path d="M19 8v8"/>
                    <path d="M15 12h8"/>
                </svg>
            </span>

            <span class="mini-heart heart-one">♥</span>
            <span class="mini-heart heart-two">♥</span>
            <span class="mini-heart heart-three">♥</span>

            <div class="qr-card" aria-label="فضای خالی کد QR">
            </div>

        </section>

        <!-- INSTRUCTIONS -->

        <footer class="instructions">

            <div class="follow-label">

                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="8" r="4"/>
                    <path d="M3 21v-2a6 6 0 0 1 6-6h1"/>
                    <path d="M19 8v8"/>
                    <path d="M15 12h8"/>
                </svg>

                برای ثبت‌نام، ابتدا این پیج را فالو کنید

            </div>

            <h2 class="instruction-title">
                سپس <span class="qr-word">کد QR</span> را اسکن کنید
            </h2>

            <p class="instruction-subtitle">
                یا از طریق <strong>لینک دانلود اپلیکیشن</strong>
                در بیوگرافی وارد شوید
            </p>

            <div class="footer-decoration"></div>

        </footer>

    </main>

</div>

</body>
</html>
