
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090B09">
<title>InstaGain | کسب درآمد از اینستاگرام</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #090B09;
    --lime: #D5FA45;
    --white: #FFFFFF;
    --muted: #A5AAA0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--white);
    font-family: "Vazirmatn", sans-serif;
}

.page {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
        max(15px, env(safe-area-inset-top))
        23px
        max(15px, env(safe-area-inset-bottom));
}

.background-glow {
    position: absolute;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    background: rgba(213,250,69,.075);
    filter: blur(100px);
    top: 15%;
    left: -180px;
    pointer-events: none;
}

.background-glow.second {
    width: 250px;
    height: 250px;
    background: rgba(213,250,69,.045);
    top: auto;
    bottom: 3%;
    left: auto;
    right: -130px;
}

.grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
}

.content {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.top-section {
    width: 100%;
    margin-bottom: 25px;
    animation: appear .9s ease both;
}

.eyebrow {
    color: var(--lime);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 11px;
}

.main-title {
    font-size: clamp(23px, 6.2vw, 31px);
    font-weight: 900;
    line-height: 1.65;
    color: #fff;
    letter-spacing: -.8px;
}

.main-title span {
    color: var(--lime);
}

.subtitle {
    color: #B7BDB2;
    font-size: 14px;
    font-weight: 400;
    margin-top: 7px;
}

.side-statements {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 15px;
}

.stat {
    flex: 1;
    min-width: 0;
    color: #E5E8E0;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.9;
    white-space: nowrap;
}

.stat::before {
    content: "";
    display: block;
    width: 17px;
    height: 2px;
    background: var(--lime);
    border-radius: 10px;
    margin: 0 auto 7px;
    box-shadow: 0 0 12px rgba(213,250,69,.45);
}

.brand {
    font-family: "Manrope", sans-serif;
    font-size: 29px;
    font-weight: 800;
    direction: ltr;
    letter-spacing: -1.8px;
    color: white;
    line-height: 1.3;
    margin-bottom: 0;
}

.brand span {
    color: var(--lime);
}

.qr-card {
    width: 100%;
    height: 30vh;
    height: 30dvh;
    min-height: 130px;
    max-height: 260px;
    flex-shrink: 0;
    background: #FFFFFF;
    border-radius: 19px;
    position: relative;
    overflow: hidden;
    box-shadow:
        0 0 0 1px rgba(255,255,255,.9),
        0 18px 55px rgba(0,0,0,.3),
        0 0 35px rgba(213,250,69,.055);
    animation: cardAppear 1.1s cubic-bezier(.2,.8,.2,1) both;
}

.qr-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(0,0,0,.035);
    border-radius: inherit;
}

.bottom-section {
    width: 100%;
    margin-top: 23px;
    animation: appear 1s .2s ease both;
}

.bottom-eyebrow {
    color: var(--lime);
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 7px;
}

.bottom-title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.8;
    color: #FFFFFF;
}

.bottom-subtitle {
    font-size: 12px;
    font-weight: 400;
    color: #AAB0A5;
    line-height: 2;
    margin-top: 3px;
}

.footer-line {
    width: 35px;
    height: 3px;
    border-radius: 10px;
    background: var(--lime);
    margin: 20px auto 0;
    box-shadow: 0 0 15px rgba(213,250,69,.35);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: scale(.94);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-height: 650px) {
    .top-section {
        margin-bottom: 13px;
    }

    .main-title {
        font-size: 23px;
        line-height: 1.5;
    }

    .side-statements {
        margin-bottom: 9px;
    }

    .qr-card {
        height: 30dvh;
        min-height: 110px;
    }

    .bottom-section {
        margin-top: 13px;
    }

    .bottom-title {
        font-size: 17px;
    }

    .footer-line {
        margin-top: 10px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="background-glow"></div>
    <div class="background-glow second"></div>
    <div class="grain"></div>

    <main class="content">

        <header class="top-section">

            <div class="eyebrow">
                دانلود اپلیکیشن
            </div>

            <h1 class="main-title">
                پلتفرم کسب درآمد
                <span>از اینستاگرام</span>
            </h1>

            <p class="subtitle">
                استفاده آسان + درآمد واقعی
            </p>

        </header>

        <section class="side-statements">

            <div class="stat">
                هفته‌ای یک ساعت فعالیت
            </div>

            <div class="stat">
                لذت از اینستاگرام با درآمد
            </div>

        </section>

        <div class="brand">
            Insta<span>Gain</span>
        </div>

        <section class="qr-card" aria-label="محل قرارگیری کد QR">
        </section>

        <footer class="bottom-section">

            <div class="bottom-eyebrow">
                برای ثبت‌نام، ابتدا این پیج را فالو کنید
            </div>

            <h2 class="bottom-title">
                سپس کد QR را اسکن کنید
            </h2>

            <p class="bottom-subtitle">
                یا از طریق لینک دانلود در بیوگرافی وارد شوید
            </p>

            <div class="footer-line"></div>

        </footer>

    </main>

</div>

</body>
</html>
