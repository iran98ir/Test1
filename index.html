
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F8F5FF">
<title>InstaGain | دانلود اپلیکیشن</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --purple: #772BDF;
    --purple-dark: #42118F;
    --pink: #EF3B9B;
    --gold: #D99B35;
    --ink: #201638;
    --muted: #77718A;
    --background: #F8F5FF;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    position: fixed;
    inset: 0;
    font-family: "Vazirmatn", sans-serif;
    background: var(--background);
    color: var(--ink);
}

.page {
    width: 100%;
    height: 100%;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding:
        max(14px, env(safe-area-inset-top))
        22px
        max(14px, env(safe-area-inset-bottom));
    isolation: isolate;
}

/* Background */

.bg {
    position: absolute;
    inset: 0;
    z-index: -3;
    background:
        radial-gradient(ellipse at 10% 15%, #E9D9FF 0%, transparent 38%),
        radial-gradient(ellipse at 90% 75%, #FFE2F3 0%, transparent 35%),
        radial-gradient(ellipse at 80% 5%, #FFF0D9 0%, transparent 25%),
        linear-gradient(145deg, #FFFFFF 0%, #F8F5FF 48%, #FFF8FC 100%);
}

.glow {
    position: absolute;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    filter: blur(75px);
    opacity: .38;
    z-index: -2;
    pointer-events: none;
}

.glow.one {
    background: #B38AFF;
    top: -110px;
    left: -100px;
}

.glow.two {
    background: #FF9ED5;
    bottom: -110px;
    right: -100px;
}

.orb {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFD36E, #E7A42F);
    box-shadow: 0 0 15px #E9B74D;
    z-index: -1;
}

.orb.one {
    top: 13%;
    right: 10%;
}

.orb.two {
    bottom: 17%;
    left: 8%;
    width: 6px;
    height: 6px;
}

/* Layout */

.content {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 2;
}

/* Header */

.header {
    width: 100%;
    animation: reveal .8s ease both;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 7px 17px;
    border-radius: 50px;
    background: rgba(119,43,223,.08);
    border: 1px solid rgba(119,43,223,.13);
    color: var(--purple);
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 13px;
}

.eyebrow::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 9px rgba(239,59,155,.5);
}

h1 {
    font-size: clamp(25px, 7vw, 34px);
    font-weight: 900;
    line-height: 1.55;
    letter-spacing: -.8px;
    color: #25183D;
}

h1 span {
    display: block;
    background: linear-gradient(95deg, #ED329B, #8A32E8 55%, #5920C3);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    font-size: 14px;
    color: var(--muted);
    font-weight: 500;
    margin-top: 7px;
}

/* Feature cards */

.features {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
    margin-top: 22px;
    margin-bottom: 17px;
}

.feature {
    min-height: 67px;
    border-radius: 17px;
    padding: 10px 8px;
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(119,43,223,.10);
    box-shadow:
        0 7px 22px rgba(74,35,122,.07),
        inset 0 1px 0 #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #382451;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.8;
}

.feature-icon {
    flex-shrink: 0;
    width: 29px;
    height: 29px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: linear-gradient(140deg, #F0E4FF, #FCE5F5);
    color: var(--purple);
}

.feature-icon svg {
    width: 19px;
    height: 19px;
}

/* Brand */

.brand {
    direction: ltr;
    font-family: "Manrope", sans-serif;
    font-size: 31px;
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: -1.7px;
    margin-bottom: 0;
    background: linear-gradient(100deg, #35156F, #8731DC 48%, #EF399C 85%, #E7A332);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 5px rgba(119,43,223,.12));
}

/* Empty QR Card */

.qr-card {
    width: 100%;
    height: 30vh;
    height: 30dvh;
    min-height: 120px;
    max-height: 260px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    background: #FFFFFF;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
        0 0 0 1px rgba(119,43,223,.13),
        0 13px 38px rgba(94,48,145,.12),
        0 3px 9px rgba(94,48,145,.06);
    animation: cardEnter 1s cubic-bezier(.2,.8,.2,1) both;
}

.qr-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 1px solid rgba(119,43,223,.045);
}

/* Instructions */

.instructions {
    width: 100%;
    margin-top: 22px;
    animation: reveal .9s .2s ease both;
}

.follow {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 50px;
    background: linear-gradient(100deg, #43158D, #7929D8);
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 800;
    box-shadow: 0 6px 17px rgba(105,39,193,.18);
    margin-bottom: 10px;
}

.instruction-title {
    font-size: 21px;
    font-weight: 900;
    color: #27183F;
    line-height: 1.7;
}

.instruction-title span {
    color: var(--purple);
}

.instruction-subtitle {
    color: #77718A;
    font-size: 12px;
    font-weight: 500;
    line-height: 2;
    margin-top: 4px;
}

.footer-line {
    width: 48px;
    height: 4px;
    border-radius: 10px;
    margin: 15px auto 0;
    background: linear-gradient(90deg, #EF399C, #8431DF, #E8A83B);
}

/* Animations */

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(13px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: scale(.95);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Compact mobile displays */

@media (max-height: 700px) {
    .header .eyebrow {
        margin-bottom: 7px;
    }

    h1 {
        font-size: 24px;
        line-height: 1.4;
    }

    .subtitle {
        margin-top: 3px;
    }

    .features {
        margin-top: 12px;
        margin-bottom: 10px;
    }

    .feature {
        min-height: 54px;
        padding: 6px;
    }

    .brand {
        font-size: 26px;
    }

    .instructions {
        margin-top: 13px;
    }

    .instruction-title {
        font-size: 18px;
    }

    .footer-line {
        margin-top: 9px;
    }
}

@media (max-height: 590px) {
    .page {
        padding-top: 8px;
        padding-bottom: 8px;
    }

    .features {
        margin-top: 8px;
        margin-bottom: 6px;
    }

    .feature {
        min-height: 45px;
        font-size: 11px;
    }

    .qr-card {
        min-height: 100px;
    }

    .instructions {
        margin-top: 8px;
    }

    .follow {
        margin-bottom: 5px;
        padding: 5px 12px;
    }

    .instruction-subtitle {
        margin-top: 0;
    }

    .footer-line {
        display: none;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="bg"></div>
    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>

    <main class="content">

        <header class="header">

            <div class="eyebrow">
                دانلود اپلیکیشن
            </div>

            <h1>
                پلتفرم کسب درآمد
                <span>از اینستاگرام</span>
            </h1>

            <p class="subtitle">
                استفاده آسان + درآمد واقعی
            </p>

        </header>

        <section class="features">

            <div class="feature">

                <span class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3 2"/>
                    </svg>
                </span>

                <span>هفته‌ای یک ساعت فعالیت</span>

            </div>

            <div class="feature">

                <span class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l3 7h7l-5.5 4.5 2 8L12 17l-6.5 4.5 2-8L2 9h7z"/>
                    </svg>
                </span>

                <span>لذت از اینستاگرام با درآمد</span>

            </div>

        </section>

        <div class="brand">
            InstaGain
        </div>

        <section class="qr-card" aria-label="محل قرارگیری کد QR">
        </section>

        <footer class="instructions">

            <div class="follow">
                برای ثبت‌نام، ابتدا این پیج را فالو کنید
            </div>

            <h2 class="instruction-title">
                سپس <span>کد QR</span> را اسکن کنید
            </h2>

            <p class="instruction-subtitle">
                یا از طریق لینک دانلود اپلیکیشن در بیوگرافی وارد شوید
            </p>

            <div class="footer-line"></div>

        </footer>

    </main>

</div>

</body>
</html>
